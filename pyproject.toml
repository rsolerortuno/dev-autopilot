[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dev-autopilot"
version = "0.1.1"
description = "Persistent, auditable multi-agent development orchestrator"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Dev Autopilot contributors" }]
dependencies = [
    "pydantic>=2.10,<3",
    "PyYAML>=6,<7",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.11",
    "pytest>=8",
    "ruff>=0.8",
    "types-PyYAML>=6",
]

[project.scripts]
dev-autopilot = "dev_autopilot.cli:main"
targetintel-autopilot = "dev_autopilot.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dev_autopilot = ["py.typed", "job-specification.schema.json"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: integration tests"]

[tool.ruff]
target-version = "py311"
line-length = 130
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true
