[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dev-autopilot"
version = "0.9.1"
description = "Persistent, auditable multi-agent development orchestrator for scientific software"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Rafael Soler Ortuño" }]
keywords = ["agents", "bioinformatics", "colab", "orchestration", "reproducibility", "scientific-software"]
dependencies = [
    "pydantic>=2.10,<3",
    "PyYAML>=6,<7",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/rsolerortuno/dev-autopilot"
Repository = "https://github.com/rsolerortuno/dev-autopilot"
Issues = "https://github.com/rsolerortuno/dev-autopilot/issues"

[project.optional-dependencies]
mcp = ["mcp>=2.2,<3"]
telemetry = ["opentelemetry-sdk>=1.30,<2"]
dev = [
    "build>=1.2",
    "setuptools>=77",
    "wheel>=0.44",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.8",
    "types-PyYAML>=6",
]
drive = [
    "google-api-python-client>=2.100",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
]

[project.scripts]
dev-autopilot = "dev_autopilot.cli:main"
targetintel-autopilot = "dev_autopilot.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dev_autopilot = ["py.typed", "*.schema.json", "evals/data/*.json"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: integration tests"]

[tool.ruff]
target-version = "py311"
line-length = 130
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["googleapiclient.*", "google.*", "google_auth_oauthlib.*"]
ignore_missing_imports = true
