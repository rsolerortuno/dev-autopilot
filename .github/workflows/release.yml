name: Build release artifacts

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build cyclonedx-bom
      - run: python -m build
      - name: Generate SBOM and checksums
        run: |
          cyclonedx-py environment --output-format JSON --output-file dist/sbom.cdx.json
          cd dist
          sha256sum * > SHA256SUMS.txt
      - name: Upload release bundle
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: dev-autopilot-release-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
