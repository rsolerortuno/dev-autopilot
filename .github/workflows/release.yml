name: Build release artifacts

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing SemVer tag to validate and package
        required: true
        type: string

permissions:
  contents: read

jobs:
  # The release cannot build unless the exact caller SHA passes every CI gate.
  validate:
    uses: ./.github/workflows/ci.yml

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0
      - name: Confirm checked-out SHA
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          else
            test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "refs/tags/${{ inputs.tag }}")"
          fi
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Verify tag and package versions
        run: python scripts/check_release_metadata.py --tag "${{ inputs.tag || github.ref_name }}" --dist dist
      - name: Install the wheel into a clean product environment
        run: |
          python -m venv .release-venv
          .release-venv/bin/python -m pip install --upgrade pip
          .release-venv/bin/python -m pip install dist/*.whl cyclonedx-bom
          .release-venv/bin/python -m pip check
          .release-venv/bin/dev-autopilot --help
      - name: Generate SBOM from installed product environment
        run: .release-venv/bin/cyclonedx-py environment --output-format JSON --output-file dist/sbom.cdx.json
      - name: Verify SBOM contains installed product
        run: |
          .release-venv/bin/python -c "import json; p=json.load(open('dist/sbom.cdx.json', encoding='utf-8')); names={c.get('name') for c in p.get('components', [])}; lower={n.lower() for n in names}; assert 'dev-autopilot' in names; assert 'pydantic' in lower; assert 'pyyaml' in lower"
      - name: Generate checksums
        run: |
          (cd dist && sha256sum * > SHA256SUMS.txt)
      - name: Upload release bundle
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: dev-autopilot-release-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
